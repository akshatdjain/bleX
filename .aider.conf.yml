# API Connection
model: openai/Qwen/Qwen3-Coder-Next-FP8
openai-api-base: https://sigmatic-asc.tech/ai/v1
openai-api-key: unused

# Architectural Preferences
architect: true
edit-format: architect
editor: micro
# File Management 
# Using 'file:' instead of 'add:' to avoid the CLI argument bug
file:
  - docker-compose.yml
  - Dockerfile
  - asset_api/.env
  - asset_api/bin/start_asset_api.sh
  - runtime/site.json
  - ui_api/database.py
  - ui_api/routers/zones.py
  - ui_api/routers/scanners.py
  - ui_api/routers/history.py
  - ui_api/routers/ui_compat.py
  - ui_api/routers/assets.py
  - ui_api/www/index.html
  - ui_api/bin/start_ui.sh
  - ui_api/schemas.py
  - ui_api/main.py
  - ui_api/models/zone_scanner.py
  - ui_api/models/__init__.py
  - ui_api/models/scanner.py
  - ui_api/models/asset.py
  - ui_api/models/zone.py
  - ui_api/models/movement.py
  - ui/index.html
  - ui/tailwind.config.js
  - ui/package.json
  - ui/vite.config.js
  - ui/src/App.jsx
  - ui/src/App.css
  - ui/src/index.css
  - ui/src/main.jsx
  - ui/postcss.config.js
  - ui/eslint.config.js

# CLI Safety Flags
add-gitignore-files: false
no-show-model-warnings: true
