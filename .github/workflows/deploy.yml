name: Deploy to DGX

on:
  push:
    branches: [master]
    paths:
      - 'asset_api/**'
      - 'docker-compose.yml'
      - 'Dockerfile.asset'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DGX via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DGX_HOST }}
          username: ${{ secrets.DGX_USER }}
          key: ${{ secrets.DGX_SSH_KEY }}
          script: |
            cd /home/akshat/asset_tracking
            git pull origin master
            # Rebuild only if requirements changed
            if git diff HEAD~1 --name-only | grep -q "requirements.txt"; then
              docker compose build --no-cache asset_api
            fi
            docker compose up -d asset_api
            echo "Deployed. Logs:"
            docker logs asset_tracking-asset_api-1 --tail 15
